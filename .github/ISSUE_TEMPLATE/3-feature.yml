name: Feature
description: Something the app cannot do yet
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        The in-app reporter files bugs only, so this form is the way to ask for something new.
        No log belongs with a request like this — it is answered by reading it.
  - type: textarea
    id: request
    attributes:
      label: What is missing?
      description: What you want to do, and why the app does not let you.
    validations:
      required: true
  - type: textarea
    id: server-support
    attributes:
      label: Does the bambuddy server support it?
      description: >
        This is a client for your own server — if its API cannot do it, the app cannot either.
        A link to the endpoint, the wiki page or the server feature helps; leave it empty if you
        do not know.
    validations:
      required: false
  - type: dropdown
    id: app
    attributes:
      label: Where should it live?
      description: The watch app is a deliberately smaller thing than the phone app.
      options:
        - Phone (Android)
        - Watch (Wear OS)
        - Both
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "0.12.1+1201000"
    validations:
      required: true
