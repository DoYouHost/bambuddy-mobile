name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  gate:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.perm.outputs.allowed }}
    steps:
      - id: perm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.comment.user.login || github.event.review.user.login || github.event.issue.user.login }}
        run: |
          LEVEL=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" -q .permission 2>/dev/null || echo none)
          echo "$ACTOR has permission: $LEVEL"
          if [[ "$LEVEL" == "admin" || "$LEVEL" == "write" ]]; then
            echo "allowed=true" >>"$GITHUB_OUTPUT"
          else
            echo "allowed=false" >>"$GITHUB_OUTPUT"
          fi

  claude:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: [self-hosted, flutter]
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read

          # The action's base allowlist is read-only plus git add/commit/push, so
          # without this Claude cannot run a single check of its own and every
          # "does this still build?" comes back as a question. These extend the
          # base list rather than replacing it, one line per concern below:
          #
          #   checks    — what CI runs; no APK build, CI already proves that one
          #   codegen   — only build_runner, never a bare `dart run <anything>`
          #   git / gh  — reading history and CI; no `gh run rerun`/`cancel`
          #   reports   — the gzipped log a "[Bug Report]" issue links to, scoped
          #               to the bug-report-assets branch the relay writes to
          #   docs      — package and server documentation
          #
          # Deliberately absent: `Bash(flutter:*)` and `Bash(dart run *)` from
          # .claude/settings.local.json. On a self-hosted runner those two are
          # "execute arbitrary code", not "run the tests".
          claude_args: |
            --model claude-opus-5
            --effort medium
            --allowedTools
            "Bash(flutter analyze:*)" "Bash(flutter test:*)" "Bash(just test)"
            "Bash(flutter pub get:*)" "Bash(flutter gen-l10n:*)" "Bash(dart run build_runner build:*)"
            "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)"
            "Bash(gh run list:*)" "Bash(gh run view:*)" "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh issue view:*)"
            "Bash(curl -sL https://raw.githubusercontent.com/DoYouHost/bambuddy-mobile/bug-report-assets/*)" "Bash(zcat:*)" "Bash(gunzip:*)"
            "WebSearch" "WebFetch(domain:pub.dev)" "WebFetch(domain:wiki.bambuddy.cool)"

