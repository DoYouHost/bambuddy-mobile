# Weekly: what moved in the bambuddy server since the last triage.
#
# State lives in the issue labelled `server-drift`; its body carries the last
# triaged server commit. A run that cannot find it fails instead of guessing a
# baseline. Seed it once by hand with `from_sha`.
#
# Checks out `dev`: "do we already have this" is a question about the integration
# branch, so the skill and `tool/server-ref-diff.sh` used here are `dev`'s copies.
# Features are triaged by what an API key can do, per surface (see the skill).
name: Server drift

on:
  # Weekly, Monday 06:37 UTC, dispatched by Dagu rather than `schedule:` (docs/release.md).
  workflow_dispatch:
    inputs:
      from_sha:
        description: 'Seed: server commit already triaged. Used only when no server-drift issue exists yet.'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  # claude-code-action authenticates over OIDC.
  id-token: write

concurrency:
  group: server-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Ensure the gh CLI
        run: |
          # The runner ships without gh. No sudo: it lands in ~/.local/bin and stays.
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if command -v gh >/dev/null || [[ -x "$HOME/.local/bin/gh" ]]; then
            "$(command -v gh || echo "$HOME/.local/bin/gh")" --version | head -1
            exit 0
          fi

          for bin in curl jq tar; do
            command -v "$bin" >/dev/null || { echo "::error::$bin is missing on this runner."; exit 1; }
          done
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::No gh build for $(uname -m)."; exit 1 ;;
          esac

          tag="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name)"
          ver="${tag#v}"
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/cli/cli/releases/download/${tag}/gh_${ver}_linux_${arch}.tar.gz" \
            | tar -xz -C "$tmp"
          install -m 0755 "$tmp/gh_${ver}_linux_${arch}/bin/gh" "$HOME/.local/bin/gh"
          rm -rf "$tmp"
          "$HOME/.local/bin/gh" --version | head -1

      - name: Server reference clone
        run: |
          echo "REF_DIR=$HOME/.cache/bambuddy-ref" >> "$GITHUB_ENV"
          REF_DIR="$HOME/.cache/bambuddy-ref"
          if [[ ! -d "$REF_DIR/.git" ]]; then
            # Partial, never shallow: the job diffs two commits.
            git clone --filter=blob:none --no-tags \
              https://github.com/maziggy/bambuddy.git "$REF_DIR"
          fi
          git -C "$REF_DIR" fetch --quiet origin "+dev:refs/remotes/origin/dev"

      - name: Resolve the baseline
        id: state
        run: |
          # The label must exist before the first query; failure is ignored because
          # "already there" is the normal case.
          gh label create server-drift \
            --color BFD4F2 \
            --description "Bambuddy server changes we have not caught up with" 2>/dev/null || true

          # Newest labelled issue that carries the marker: the label is applied by
          # hand too, and a stray one (#32) once took the baseline down.
          issues="$(gh issue list --label server-drift --state all --limit 30 --json number,state,body)"
          # `^` in jq is the start of the whole body, not of a line.
          issue="$(jq -c 'map(select((.body // "") | test("(^|\n)server_sha: [0-9a-f]{7,}"))) | .[0] // empty' <<<"$issues")"
          number="$(jq -r '.number // empty' <<<"$issue")"
          state="$(jq -r '.state // empty' <<<"$issue")"
          from="$(jq -r '.body // ""' <<<"$issue" | sed -n 's/^server_sha: \([0-9a-f]\{7,\}\).*/\1/p' | head -1)"

          if [[ -z "$from" ]]; then
            from="${{ inputs.from_sha }}"
            if [[ -z "$from" ]]; then
              echo "::error::No server-drift issue carrying a server_sha marker, and no from_sha input. Seed this job once by hand: Actions → Server drift → Run workflow, with the server commit already triaged."
              exit 1
            fi
            echo "seeding from $from"
          fi

          {
            echo "from=$from"
            echo "issue_number=$number"
            echo "issue_state=$state"
          } >> "$GITHUB_OUTPUT"

          # The open list without the state marker; the triage edits it in place.
          mkdir -p .server-drift
          # Issue bodies come back with CRLF; without the tr the sed range would
          # delete the whole list.
          jq -r '.body // ""' <<<"$issue" | tr -d '\r' \
            | sed '/^<!-- server-drift state/,/^-->$/d' > .server-drift/open-items-current.md

      # A mis-gated route still yields a plausible line, so test the scan first.
      - name: Self-test the gate scan
        run: tool/server-ref-diff.sh --self-test

      - name: Filter the range
        id: filter
        run: |
          tool/server-ref-diff.sh \
            --from "${{ steps.state.outputs.from }}" \
            --ref "$REF_DIR" \
            --no-fetch \
            --out "$GITHUB_WORKSPACE/.server-drift"
          echo "drift=$(cat .server-drift/drift)" >> "$GITHUB_OUTPUT"
          cat .server-drift/facts.md >> "$GITHUB_STEP_SUMMARY"

      # Read-only tool list: `sed -n` not `sed` (-i writes), no `find` (-delete and
      # -exec are a shell). The only output is the two files it is told to Write.
      - name: Triage
        if: steps.filter.outputs.drift == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY }}
          # Thin on purpose: the action refuses to run unless this file matches
          # master's copy, so wording lives in the skill.
          prompt: |
            Read .claude/skills/reference-update/SKILL.md and follow it from
            step 3 — the baseline is resolved and the input is written.

            Inputs: .server-drift/facts.md, .server-drift/diff.md, and the list
            standing before this run at .server-drift/open-items-current.md
            (empty on a first run). The server reference clone is at
            ${{ env.REF_DIR }}.

            Outputs: .server-drift/report.md and .server-drift/open-items.md.
          claude_args: |
            --model claude-sonnet-5
            --effort medium
            --add-dir ${{ env.REF_DIR }}
            --allowedTools
            "Read" "Grep" "Glob" "Write"
            "Bash(git -C ${{ env.REF_DIR }} show:*)" "Bash(git -C ${{ env.REF_DIR }} diff:*)" "Bash(git -C ${{ env.REF_DIR }} log:*)"
            "Bash(git log:*)" "Bash(git diff:*)" "Bash(git show:*)"
            "Bash(cat:*)" "Bash(ls:*)" "Bash(head:*)" "Bash(tail:*)" "Bash(wc:*)" "Bash(grep:*)" "Bash(sed -n:*)"

      - name: Keep the triage output
        if: always() && steps.filter.outputs.drift == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: server-drift-${{ github.run_id }}
          path: .server-drift/
          retention-days: 30
          # .server-drift is a dot directory; v4 skips hidden paths by default.
          include-hidden-files: true

      - name: File the report
        if: steps.filter.outputs.drift == 'yes'
        run: |
          report=.server-drift/report.md
          items=.server-drift/open-items.md
          for f in "$report" "$items"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::The triage step produced no $f."
              exit 1
            fi
          done

          # A standing line may leave the list only through the report's Struck off
          # (see the skill); the triage once dropped #3112 silently.
          struck="$(awk '/^#+ /{on = /^#+ Struck off/} on' "$report")"
          lost=0
          while IFS= read -r line; do
            grep -qxF -- "$line" "$items" && continue
            grep -qF -- "${line#- \[ \] }" <<<"$struck" && continue
            echo "::error::Dropped without a Struck off entry: $line"
            lost=1
          done < <(grep -E '^- \[ \] ' .server-drift/open-items-current.md)
          if (( lost )); then
            exit 1
          fi

          to_sha="$(cat .server-drift/to_sha)"
          dev_sha="$(cat .server-drift/dev_sha)"
          title="Server drift: ${to_sha:0:8}"
          number="${{ steps.state.outputs.issue_number }}"

          # The body is only what is still owed: ticked lines and `Watch only` go
          # into this run's comment. Done here, not by the triage, which kept every
          # ticked line (#31 reached 15). An emptied section keeps its heading.
          awk -v K=kept.md -v H=harvest.md '
            function flush(   i) {
              if (sec == "") return
              if (!drop) {
                print "## " sec > K
                print "" > K
                if (nk == 0) print "- none" > K
                else for (i = 1; i <= nk; i++) print kbuf[i] > K
                print "" > K
              }
              if (nh > 0) {
                print "### " sec > H
                for (i = 1; i <= nh; i++) print hbuf[i] > H
                print "" > H
              }
              split("", kbuf); split("", hbuf); nk = 0; nh = 0
            }
            /^## / {
              flush()
              sec = $0; sub(/^## +/, "", sec)
              drop = (sec == "Watch only" || sec == "Questions")
              next
            }
            {
              if ($0 ~ /^[ \t]*$/) next
              if (sec == "") { print > K; next }
              if (drop || $0 ~ /^- \[x\]/) hbuf[++nh] = $0
              else kbuf[++nk] = $0
            }
            END { flush() }
          ' "$items"

          if [[ ! -s kept.md ]]; then
            echo "::error::The split produced an empty checklist from $items."
            exit 1
          fi

          {
            echo "<!-- server-drift state, read by .github/workflows/server-drift.yml"
            echo "server_sha: $to_sha"
            echo "dev_sha: $dev_sha"
            echo "-->"
            echo
            cat kept.md
          } > body.md

          # Comment = this range's report plus what the split lifted out.
          {
            cat "$report"
            if [[ -s harvest.md ]]; then
              echo
              echo "---"
              echo
              echo "## Lifted out of the checklist"
              echo
              echo "Ticked off, or reference rather than work. Kept here because the body is only what is still owed."
              echo
              cat harvest.md
            fi
          } > comment.md

          # An open issue gets this record; a closed one means that range is done,
          # so the next gets an issue of its own.
          if [[ -n "$number" && "${{ steps.state.outputs.issue_state }}" == "OPEN" ]]; then
            gh issue edit "$number" --title "$title" --body-file body.md
            echo "updated issue #$number"
          else
            url="$(gh issue create --title "$title" --label server-drift --body-file body.md)"
            number="${url##*/}"
            echo "opened $url"
          fi

          gh issue comment "$number" --body-file comment.md

      - name: Nothing moved
        if: steps.filter.outputs.drift == 'no'
        run: |
          msg="No contract path changed since ${FROM:0:8} — no issue filed."
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
        env:
          FROM: ${{ steps.state.outputs.from }}
