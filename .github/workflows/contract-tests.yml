name: Contract tests

# Does our parsing still match what the server actually sends?
#
# `flutter test` answers a different question. Its mocked transport replays
# fixtures we wrote ourselves, so a suite can be green while the wire has moved
# underneath it — which is how the queue's filament colours and the http/https
# redirect both shipped. This job puts a real bambuddy behind the real Dio
# client and parses real responses with the real models.
#
# Runs on [self-hosted, ci-docker], which is the ONE runner whose jobs are
# handed the Docker daemon (TofuSadurkiV2/ci_runner_docker). A job there can
# create a privileged container, i.e. own that host — so note what is missing
# from the triggers below:
#
#   there is no `pull_request`, and that is deliberate.
#
# This repository is public. A fork PR is code written by a stranger, and
# letting it reach a runner with the Docker socket hands that stranger the box.
# Branch pushes and manual dispatch only; the org runner group is additionally
# restricted to this workflow file, so even a matching `runs-on` elsewhere gets
# no runner.

on:
  workflow_dispatch:
  push:
    branches: [dev, master]
    paths:
      - "lib/core/**"
      - "lib/data/**"
      - "test/contract/**"
      - ".github/workflows/contract-tests.yml"
  # The server moves ~100 commits a fortnight, so most breakage arrives without
  # a commit of ours to hang it on. server-drift.yml reads that as a diff; this
  # catches the half that a diff cannot judge.
  schedule:
    - cron: "23 4 * * *"

concurrency:
  group: contract-tests
  cancel-in-progress: false

permissions:
  contents: read

env:
  BAMBUDDY_IMAGE: ghcr.io/maziggy/bambuddy:latest
  ADMIN_USER: ci-admin
  # Server-side rule (backend/app/schemas/auth.py::_validate_password_complexity):
  # upper, lower, digit, special, >= 8. Not a secret — the instance is created
  # empty for this run and destroyed with it.
  ADMIN_PASS: CiTest!2026x

jobs:
  contract:
    name: parse real server responses
    runs-on: [self-hosted, ci-docker]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Toolchain
        run: flutter --version

      # The server runs as a SIBLING container, not inside this job, so
      # "localhost" is not shared. Publishing on the bridge gateway is what both
      # sides can name: the job reaches its own default route, and nothing on
      # the LAN can reach the port.
      # Two containers, both siblings of this job on the docker bridge. The
      # server is published on the bridge gateway because "localhost" is not
      # shared between siblings; nothing on the LAN can reach that address.
      - name: Start bambuddy and the stand-in printer
        id: server
        run: |
          set -euo pipefail
          gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          [ -n "$gateway" ] || { echo "bridge network reports no gateway"; exit 1; }

          certs="$RUNNER_TEMP/fake-printer-certs"
          mkdir -p "$certs"
          # Self-signed is not a shortcut: BambuMQTTClient sets CERT_NONE and
          # check_hostname = False because Bambu printers ship exactly this.
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$certs/server.key" -out "$certs/server.crt" \
            -subj "/CN=fake-bambu" >/dev/null 2>&1
          chmod -R a+rX "$certs"

          broker="fake-printer-${GITHUB_RUN_ID}"
          server="bambuddy-ci-${GITHUB_RUN_ID}"
          echo "broker=$broker" >> "$GITHUB_OUTPUT"
          echo "name=$server" >> "$GITHUB_OUTPUT"

          docker pull --quiet eclipse-mosquitto:2
          docker create --rm --name "$broker" eclipse-mosquitto:2
          docker cp tool/ci/mosquitto.conf "$broker":/mosquitto/config/mosquitto.conf
          docker cp "$certs" "$broker":/mosquitto/certs
          docker start "$broker"

          docker pull --quiet "$BAMBUDDY_IMAGE"
          docker run -d --rm --name "$server" \
            -p "${gateway}:8000:8000" \
            -e "DATA_DIR=/app/data" -e "TZ=Europe/Warsaw" \
            "$BAMBUDDY_IMAGE"

          broker_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$broker")"
          echo "broker_ip=$broker_ip" >> "$GITHUB_OUTPUT"
          echo "base=http://${gateway}:8000" >> "$GITHUB_OUTPUT"

      # Waits for /health itself, then walks the server up to one printer
      # reporting a job, one uploaded file and one queued item.
      - name: Seed
        run: |
          python3 tool/ci/seed_bambuddy.py \
            --base-url "${{ steps.server.outputs.base }}" \
            --broker-ip "${{ steps.server.outputs.broker_ip }}" \
            --broker-container "${{ steps.server.outputs.broker }}" \
            --admin-user "$ADMIN_USER" --admin-pass "$ADMIN_PASS"

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      # test/contract/ is skipped by `flutter test` everywhere else — the guard
      # is the absence of this variable, so `just test` on a laptop stays green
      # without a server.
      - name: Contract tests
        env:
          BAMBUDDY_CONTRACT_URL: ${{ steps.server.outputs.base }}
          BAMBUDDY_CONTRACT_USER: ${{ env.ADMIN_USER }}
          BAMBUDDY_CONTRACT_PASS: ${{ env.ADMIN_PASS }}
          # NOT decoration, and not cosmetic either: the runner is UTC, where a
          # naive timestamp read as local and the same one read as UTC are the
          # same instant — so the timestamp contract would pass no matter which
          # the app did. Measured: with TZ unset the parser swapped for a naive
          # DateTime.parse still went green; at this offset it fails by two
          # hours. Any zone but UTC will do; this one matches the server's.
          TZ: Europe/Warsaw
        run: flutter test test/contract --reporter expanded

      - name: Logs on failure
        if: failure()
        run: |
          echo "::group::bambuddy"
          docker logs "${{ steps.server.outputs.name }}" 2>&1 | tail -200
          echo "::endgroup::"
          echo "::group::stand-in printer"
          docker logs "${{ steps.server.outputs.broker }}" 2>&1 | tail -50
          echo "::endgroup::"

      # --rm covers the ordinary exit; this covers a cancelled job, and the
      # runner wrapper sweeps whatever survives even that before the next job.
      - name: Tear down
        if: always()
        run: |
          docker rm -f "${{ steps.server.outputs.name }}" >/dev/null 2>&1 || true
          docker rm -f "${{ steps.server.outputs.broker }}" >/dev/null 2>&1 || true
