name: Contract tests

# Does our parsing still match what the real server sends? A real bambuddy behind
# the real Dio client; `flutter test` only replays fixtures we wrote.
#
# Runs on the one `ci-docker` runner, which has the Docker daemon, so a job there
# can own the host. There is no `pull_request` trigger on purpose: the repo is
# public and a fork PR must never reach that runner. Branch pushes and manual
# dispatch only; the org runner group is also restricted to this workflow file.

on:
  # Daily 04:23 UTC, dispatched by Dagu rather than `schedule:` (docs/release.md).
  workflow_dispatch:
  push:
    branches: [dev, master]
    paths:
      - "lib/core/**"
      - "lib/data/**"
      - "test/contract/**"
      - ".github/workflows/contract-tests.yml"

concurrency:
  group: contract-tests
  cancel-in-progress: false

permissions:
  contents: read

env:
  # DoYouHost/brother-ql-print-server, pinned: the label tests assert its behaviour.
  LABEL_PRINTER_REF: b6c91c44bba43ed8f75f45c0cb3ac6878753b27c
  ADMIN_USER: ci-admin
  # Meets the server's password complexity rule; not a secret, the instance lives one run.
  ADMIN_PASS: CiTest!2026x

jobs:
  contract:
    name: parse real server responses (${{ matrix.tag }})
    runs-on: [self-hosted, ci-docker]
    timeout-minutes: 30
    # `latest` is the last release, `daily` the development branch, `1.2.5` a fixed
    # older release. Tests detect which one they got and assert the matching half.
    # One at a time: the jobs share one runner and one bridge-gateway port.
    # fail-fast is off so a break on `daily` never hides the release result.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tag: [latest, daily, "1.2.5"]
    env:
      BAMBUDDY_IMAGE: ghcr.io/maziggy/bambuddy:${{ matrix.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Toolchain
        run: flutter --version

      # The containers are siblings of this job, so "localhost" is not shared:
      # publish on the bridge gateway, which nothing on the LAN can reach.
      - name: Start bambuddy and the stand-in printer
        id: server
        run: |
          set -euo pipefail
          gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          [ -n "$gateway" ] || { echo "bridge network reports no gateway"; exit 1; }

          certs="$RUNNER_TEMP/fake-printer-certs"
          mkdir -p "$certs"
          # Self-signed on purpose: BambuMQTTClient uses CERT_NONE, as Bambu printers do.
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$certs/server.key" -out "$certs/server.crt" \
            -subj "/CN=fake-bambu" >/dev/null 2>&1
          chmod -R a+rX "$certs"

          broker="fake-printer-${GITHUB_RUN_ID}-${{ matrix.tag }}"
          server="bambuddy-ci-${GITHUB_RUN_ID}-${{ matrix.tag }}"
          spoolman="spoolman-ci-${GITHUB_RUN_ID}-${{ matrix.tag }}"
          labelprinter="label-printer-ci-${GITHUB_RUN_ID}-${{ matrix.tag }}"
          {
            echo "broker=$broker"
            echo "labelprinter=$labelprinter"
            echo "name=$server"
            echo "spoolman=$spoolman"
          } >> "$GITHUB_OUTPUT"

          docker pull --quiet eclipse-mosquitto:2
          docker create --rm --name "$broker" eclipse-mosquitto:2
          docker cp tool/ci/mosquitto.conf "$broker":/mosquitto/config/mosquitto.conf
          docker cp "$certs" "$broker":/mosquitto/certs
          docker start "$broker"

          # Off until spoolman_contract_test enables it; the default bridge has no
          # DNS, so the server gets an IP.
          docker pull --quiet ghcr.io/donkie/spoolman:latest
          docker run -d --rm --name "$spoolman" ghcr.io/donkie/spoolman:latest

          # Prints into a file instead of a Brother printer; installs itself on
          # start (about a minute).
          docker pull --quiet python:3.13-slim
          docker run -d --rm --name "$labelprinter" \
            -p "${gateway}:8200:8000" \
            -e PRINTER_IDENTIFIER=file:///tmp/lp0 \
            -e LABEL_PRINTER_HOST=0.0.0.0 -e LABEL_PRINTER_PORT=8000 \
            python:3.13-slim sh -c "apt-get update -qq \
              && apt-get install -y -qq --no-install-recommends poppler-utils git >/dev/null \
              && pip install -q 'git+https://github.com/DoYouHost/brother-ql-print-server@${LABEL_PRINTER_REF}' \
              && : > /tmp/lp0 && python -m label_printer"

          docker pull --quiet "$BAMBUDDY_IMAGE"
          docker run -d --rm --name "$server" \
            -p "${gateway}:8000:8000" \
            -e "DATA_DIR=/app/data" -e "TZ=Europe/Warsaw" \
            "$BAMBUDDY_IMAGE"

          broker_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$broker")"
          echo "broker_ip=$broker_ip" >> "$GITHUB_OUTPUT"
          spoolman_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$spoolman")"
          {
            echo "spoolman_url=http://${spoolman_ip}:8000"
            echo "base=http://${gateway}:8000"
            echo "labelprinter_url=http://${gateway}:8200"
          } >> "$GITHUB_OUTPUT"

      # Daily only: no release has the Manyfold routes (#1471) yet, and the image
      # is 1.5 GB. Started early so its first boot overlaps the seed.
      - name: Start Manyfold
        id: manyfold
        if: matrix.tag == 'daily'
        run: |
          set -euo pipefail
          name="manyfold-ci-${GITHUB_RUN_ID}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          library="$RUNNER_TEMP/manyfold-library"
          mkdir -p "$library/Contract model"
          printf 'solid t\nfacet normal 0 0 1\nouter loop\nvertex 0 0 0\nvertex 10 0 0\nvertex 0 10 0\nendloop\nendfacet\nendsolid t\n' \
            > "$library/Contract model/contract.stl"
          echo "not printable" > "$library/Contract model/readme.txt"
          chmod -R a+rX "$library"

          docker pull --quiet ghcr.io/manyfold3d/manyfold-solo:latest
          docker create --rm --name "$name" \
            -e SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            ghcr.io/manyfold3d/manyfold-solo:latest >/dev/null
          # docker cp rather than -v: the daemon's filesystem is not the runner's.
          docker cp "$library/." "$name":/libraries
          docker start "$name" >/dev/null
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$name")"
          echo "url=http://${ip}:3214" >> "$GITHUB_OUTPUT"

      - name: Wait for the label print server
        run: |
          set -euo pipefail
          for _ in $(seq 1 100); do
            if curl -sf "${{ steps.server.outputs.labelprinter_url }}/info" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs "${{ steps.server.outputs.labelprinter }}" 2>&1 | tail -40
          echo "the label print server never answered /info"
          exit 1

      # Waits for /health, then seeds one printer with a job, one file, one queued item.
      - name: Seed
        run: |
          bash tool/ci/seed_bambuddy.sh \
            --base-url "${{ steps.server.outputs.base }}" \
            --broker-ip "${{ steps.server.outputs.broker_ip }}" \
            --broker-container "${{ steps.server.outputs.broker }}" \
            --admin-user "$ADMIN_USER" --admin-pass "$ADMIN_PASS"

      # Retried: `rails runner` fails until the first boot has migrated the database.
      - name: Set up Manyfold
        id: manyfold_app
        if: matrix.tag == 'daily'
        run: |
          set -euo pipefail
          name="${{ steps.manyfold.outputs.name }}"
          docker cp tool/ci/manyfold_setup.rb "$name":/tmp/manyfold_setup.rb
          for _ in $(seq 1 30); do
            if out="$(docker exec "$name" sh -c 'cd /usr/src/app && bin/rails runner /tmp/manyfold_setup.rb' 2>&1)" \
              && grep -q '^CLIENT_SECRET=' <<<"$out"; then
              id="$(grep '^CLIENT_ID=' <<<"$out" | cut -d= -f2-)"
              secret="$(grep '^CLIENT_SECRET=' <<<"$out" | cut -d= -f2-)"
              echo "::add-mask::$secret"
              echo "client_id=$id" >> "$GITHUB_OUTPUT"
              echo "client_secret=$secret" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          tail -40 <<<"$out"
          echo "Manyfold never finished its setup"
          exit 1

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      # test/contract/ is skipped elsewhere: the guard is the absence of
      # BAMBUDDY_CONTRACT_URL.
      - name: Contract tests
        env:
          BAMBUDDY_CONTRACT_URL: ${{ steps.server.outputs.base }}
          BAMBUDDY_CONTRACT_USER: ${{ env.ADMIN_USER }}
          BAMBUDDY_CONTRACT_PASS: ${{ env.ADMIN_PASS }}
          # For the bed-jog test, which reads the G-code the server publishes.
          BAMBUDDY_CONTRACT_BROKER: ${{ steps.server.outputs.broker }}
          BAMBUDDY_CONTRACT_BROKER_IP: ${{ steps.server.outputs.broker_ip }}
          BAMBUDDY_CONTRACT_SPOOLMAN_URL: ${{ steps.server.outputs.spoolman_url }}
          # Prints into /tmp/lp0 in its container; the tests read it via `docker exec`.
          LABEL_PRINTER_CONTRACT_URL: ${{ steps.server.outputs.labelprinter_url }}
          LABEL_PRINTER_CONTRACT_CONTAINER: ${{ steps.server.outputs.labelprinter }}
          LABEL_PRINTER_CONTRACT_OUT: /tmp/lp0
          BAMBUDDY_CONTRACT_MANYFOLD_URL: ${{ steps.manyfold.outputs.url }}
          BAMBUDDY_CONTRACT_MANYFOLD_CLIENT_ID: ${{ steps.manyfold_app.outputs.client_id }}
          BAMBUDDY_CONTRACT_MANYFOLD_CLIENT_SECRET: ${{ steps.manyfold_app.outputs.client_secret }}
          # Not decoration: on a UTC runner a naive timestamp passes whether it is
          # read as local or as UTC. Any zone but UTC works.
          TZ: Europe/Warsaw
        # One file at a time: they share a server, and SQLite reuses a deleted row's id.
        run: flutter test test/contract --concurrency=1 --reporter expanded

      # maziggy/bambuddy#3320: a write answered 200 must already be committed. The
      # server is made to commit a second late and one file runs against it; it
      # skips itself on servers older than the fix (1.3.1). Last, because the
      # restart touches the server every other file shares.
      - name: Commit before response
        env:
          BAMBUDDY_CONTRACT_URL: ${{ steps.server.outputs.base }}
          BAMBUDDY_CONTRACT_USER: ${{ env.ADMIN_USER }}
          BAMBUDDY_CONTRACT_PASS: ${{ env.ADMIN_PASS }}
          BAMBUDDY_CONTRACT_COMMIT_DELAY: "1"
          TZ: Europe/Warsaw
        run: |
          bash tool/ci/delay_commit.sh \
            "${{ steps.server.outputs.name }}" "${{ steps.server.outputs.base }}"
          flutter test test/contract/commit_before_response_contract_test.dart \
            --reporter expanded

      - name: Logs on failure
        if: failure()
        run: |
          echo "::group::bambuddy"
          docker logs "${{ steps.server.outputs.name }}" 2>&1 | tail -200
          echo "::endgroup::"
          echo "::group::stand-in printer"
          docker logs "${{ steps.server.outputs.broker }}" 2>&1 | tail -50
          echo "::endgroup::"
          echo "::group::spoolman"
          docker logs "${{ steps.server.outputs.spoolman }}" 2>&1 | tail -50
          echo "::endgroup::"
          echo "::group::label print server"
          docker logs "${{ steps.server.outputs.labelprinter }}" 2>&1 | tail -80
          echo "::endgroup::"
          if [ -n "${{ steps.manyfold.outputs.name }}" ]; then
            echo "::group::manyfold"
            docker logs "${{ steps.manyfold.outputs.name }}" 2>&1 | tail -80
            echo "::endgroup::"
          fi

      # --rm covers a normal exit; this covers a cancelled job.
      - name: Tear down
        if: always()
        run: |
          docker rm -f "${{ steps.server.outputs.name }}" >/dev/null 2>&1 || true
          docker rm -f "${{ steps.server.outputs.broker }}" >/dev/null 2>&1 || true
          docker rm -f "${{ steps.server.outputs.spoolman }}" >/dev/null 2>&1 || true
          docker rm -f "${{ steps.server.outputs.labelprinter }}" >/dev/null 2>&1 || true
          docker rm -f "${{ steps.manyfold.outputs.name }}" >/dev/null 2>&1 || true
