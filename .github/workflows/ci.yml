name: CI

# What `just test` plus a compile of both flavors would tell you locally.
# @claude reads this run before asking a question.
# Runs on the self-hosted `flutter` runners, which carry the SDKs and a warm cache.

on:
  pull_request:
    branches: [master]
    # No paths-ignore: a workflow that does not run reports no check, and the
    # required status on master would wait forever. The filter is a step below.
  workflow_dispatch:

# A force-push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Reading which files a pull request touches, for the path filter below.
  pull-requests: read

jobs:
  check:
    name: analyze · test · build
    runs-on: [self-hosted, flutter]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Decided here instead of `paths-ignore`, so the required check is still
      # reported. Anything undeterminable falls through to building.
      - name: Does this change need a build?
        id: relevant
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request — building"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files"
          files=""
          for page in 1 2 3 4 5; do
            batch="$(curl -fsS --max-time 20 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}?per_page=100&page=${page}" | jq -r '.[].filename')" || {
                echo "could not list changed files — building"
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
              }
            [ -z "${batch}" ] && break
            files="${files}${batch}"$'\n'
            [ "$(printf '%s' "${batch}" | wc -l)" -lt 99 ] && break
            if [ "${page}" -eq 5 ]; then
              echo "more changed files than we read — building"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          if [ -z "${files//[[:space:]]/}" ]; then
            echo "no files reported — building"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `case` globs span slashes: site/* covers site/a/b, *.md any depth.
          needs_build=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              site/*|docs/*|store-assets/*|*.md) ;;
              *) needs_build=true; echo "needs a build: $f" ;;
            esac
          done <<< "${files}"

          if [ "${needs_build}" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "only docs, site or store copy changed — nothing to build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Toolchain
        if: steps.relevant.outputs.run == 'true'
        run: flutter --version

      # --enforce-lockfile: a stale lock fails here instead of quietly resolving.
      - name: Dependencies
        if: steps.relevant.outputs.run == 'true'
        run: flutter pub get --enforce-lockfile

      # Fix a red run with `dart format lib test tool`, never by hand.
      - name: Format
        if: steps.relevant.outputs.run == 'true'
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        if: steps.relevant.outputs.run == 'true'
        run: flutter analyze

      - name: Test
        if: steps.relevant.outputs.run == 'true'
        run: flutter test

      - name: Compile check (mobile)
        if: steps.relevant.outputs.run == 'true'
        run: flutter build apk --debug --flavor mobile --target-platform android-arm64

      - name: Compile check (wear)
        if: steps.relevant.outputs.run == 'true'
        run: |
          flutter build apk --debug --flavor wear \
            --target lib/wear/main_wear.dart --target-platform android-arm64

      # What `flutter test` cannot see: phone-only assets pruned from the watch
      # APK, and no ContentProviders in `Application.onCreate`. Both fail silently.
      # Runs on the APKs built above; the phone APK is the control.
      - name: Watch APK contents
        if: steps.relevant.outputs.run == 'true'
        run: |
          python3 tool/check_wear_apk.py \
            build/app/outputs/flutter-apk/app-wear-debug.apk \
            --mobile build/app/outputs/flutter-apk/app-mobile-debug.apk
