name: CI

# What `just test` plus a compile of both flavors would tell you locally.
# @claude reads this run before asking a question.
# GitHub-hosted runners: free for a public repo, one VM per job, no shared CPU.

on:
  pull_request:
    branches: [master]
    # No paths-ignore: a workflow that does not run reports no check, and the
    # required status on master would wait forever. The filter is the `changes` job.
  workflow_dispatch:

# A force-push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Reading which files a pull request touches, for the `changes` job.
  pull-requests: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  # Decided here instead of `paths-ignore`, so the required check is still
  # reported. Anything undeterminable falls through to building.
  changes:
    name: Does this change need a build?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.relevant.outputs.run }}
    steps:
      - name: Changed files
        id: relevant
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request — building"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files"
          files=""
          for page in 1 2 3 4 5; do
            batch="$(curl -fsS --max-time 20 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}?per_page=100&page=${page}" | jq -r '.[].filename')" || {
                echo "could not list changed files — building"
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
              }
            [ -z "${batch}" ] && break
            files="${files}${batch}"$'\n'
            [ "$(printf '%s' "${batch}" | wc -l)" -lt 99 ] && break
            if [ "${page}" -eq 5 ]; then
              echo "more changed files than we read — building"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          if [ -z "${files//[[:space:]]/}" ]; then
            echo "no files reported — building"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `case` globs span slashes: site/* covers site/a/b, *.md any depth.
          needs_build=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              site/*|docs/*|store-assets/*|*.md) ;;
              *) needs_build=true; echo "needs a build: $f" ;;
            esac
          done <<< "${files}"

          if [ "${needs_build}" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "only docs, site or store copy changed — nothing to build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: analyze
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # --enforce-lockfile: a stale lock fails here instead of quietly resolving.
      - run: flutter pub get --enforce-lockfile
      # Fix a red run with `dart format lib test tool`, never by hand.
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze

  # Everything but test/a11y, which is most of the wall clock and has its own jobs.
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Test
        run: |
          mapfile -t files < <(find test -name '*_test.dart' -not -path 'test/a11y/*' | sort)
          flutter test --concurrency=4 "${files[@]}"

  # One `flutter test` process per job (several in one workspace corrupt
  # build/test_cache); the shards are separate VMs.
  a11y:
    name: a11y (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: A11y guideline tests
        run: |
          mapfile -t files < <(find test/a11y -name '*_test.dart' | sort | awk -v s=${{ matrix.shard }} 'NR % 3 == s')
          [ "${#files[@]}" -gt 0 ] || { echo "empty shard"; exit 1; }
          flutter test --concurrency=4 "${files[@]}"

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile check (mobile)
        run: flutter build apk --debug --flavor mobile --target-platform android-arm64
      - name: Compile check (wear)
        run: |
          flutter build apk --debug --flavor wear \
            --target lib/wear/main_wear.dart --target-platform android-arm64
      # What `flutter test` cannot see: phone-only assets pruned from the watch
      # APK, and no ContentProviders in `Application.onCreate`. Both fail silently.
      # Runs on the APKs built above; the phone APK is the control.
      - name: Watch APK contents
        run: |
          python3 tool/check_wear_apk.py \
            build/app/outputs/flutter-apk/app-wear-debug.apk \
            --mobile build/app/outputs/flutter-apk/app-mobile-debug.apk

  # The one status master requires. A skipped job (docs-only change) counts as
  # passed; a failed or cancelled one does not.
  check:
    name: analyze · test · build
    needs: [changes, analyze, test, a11y, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "$results"
          case " $results " in *" failure "*|*" cancelled "*) exit 1 ;; esac
