name: Pages

# Ships `site/` from master. The privacy policy URL is registered in the Play
# Console, so a broken deploy is a live-listing problem:
#   https://doyouhost.github.io/bambuddy-mobile/privacy.html
# The deploy is shared with lubelogger-mobile; pinned to `master` until app-shared
# cuts a tag that carries it.

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Never cancel a running deploy: a half-applied one would take the policy URL down.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: DoYouHost/app-shared/.github/workflows/pages.yml@master
    permissions:
      pages: write
      id-token: write
