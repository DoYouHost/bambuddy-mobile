name: bambuddy_mobile
description: "Native Android app for bambuddy, the self-hosted Bambu Lab printer manager."
publish_to: 'none'

version: 0.14.1+2028020

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Report transport, outbox and redaction, shared with lubelogger-mobile.
  # Pinned to a tag, the way the OpenTofu modules are: a moving ref would let a
  # change over there reach a release from here without a commit in this repo.
  #
  # Must be the same ref `app_diagnostics` names for its own copy: one package
  # resolved from two refs fails version solving outright.
  app_report_client:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.2.0
      path: packages/app_report_client
  # The recording session, the log record and the probes, shared with
  # lubelogger-mobile. Same repository, same pinning rule as above, and the
  # same ref `app_report_ui` names for its own copy.
  app_diagnostics:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.11.0
      path: packages/app_diagnostics
  # The report screens — the guided flow, the recording bar and the review —
  # shared with lubelogger-mobile.
  app_report_ui:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.11.0
      path: packages/app_report_ui
  # The design system and the widgets that name themselves in the diagnostic
  # log, shared with lubelogger-mobile. `dash_kit` re-exports `dash_ui`, so this
  # is the only one named here; it pins `dash_ui` at the ref `app_report_ui`
  # names for its own copy.
  dash_kit:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.11.0
      path: packages/dash_kit
  # JSON coercion, user-typed numbers, the demo adapter, the server address and
  # the request-failure classification, shared with lubelogger-mobile.
  app_util:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.11.0
      path: packages/app_util
  clock: ^1.1.2
  collection: ^1.19.0
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: '>=10.3.4 <11.0.0'
  go_router: '>=16.0.0 <18.0.0'
  intl: ^0.20.2
  json_annotation: ^4.12.0
  # Annotations only; the generator behind them is a dev dependency. Both models
  # that carry a full-field copy are annotated, so the field list lives in the
  # constructor alone — a new field can no longer be dropped on the copy.
  copy_with_extension: ^17.0.0
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.3
  flutter_local_notifications: ^22.3.1
  flutter_foreground_task: ^11.0.3
  url_launcher: ^6.3.0
  flutter_svg: ^2.3.0
  mobile_scanner: ^7.2.0
  flutter_colorpicker: ^1.1.0
  fl_chart: ^1.2.0
  package_info_plus: '>=8.0.0 <11.0.0'
  home_widget: ^0.10.0
  path_provider: ^2.1.5
  webview_flutter: ^4.10.0
  file_picker: '>=8.1.6 <11.0.0'
  watch_connectivity: ^0.2.9
  printing: ^5.15.0
  video_player: ^2.14.0
  gal: ^2.3.3
  share_plus: ^12.0.2
  flutter_file_dialog: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device tests (`just test-device`). A mocked adapter never performs a real
  # read off a socket, which is exactly what the camera stream is.
  integration_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.8.0
  copy_with_extension_gen: ^17.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  # Test-only: swaps the temporary directory for one the test owns, so the
  # cache a download lands in can be inspected. Already in the tree as a
  # transitive dependency of path_provider; named here because the analyzer
  # will not let a test import what the pubspec does not list.
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/hms/
    # Listed file by file rather than as a directory: these three are vendored
    # from the server (assets/slicer/PROVENANCE), and that note has no business
    # in the APK.
    - assets/slicer/process-schema.json
    - assets/slicer/process-ui-tree.json
    - assets/slicer/process-toggle-rules.json
    - assets/icons/
    - assets/icon/icon.png
    # The in-app G-code preview: the page shell, the bundle, and the app's
    # own faces subset into a stylesheet — all built by tool/gcode_viewer (see
    # its PROVENANCE). The three are inlined into one document at runtime, so
    # they must ship as assets rather than be fetched over http. The faces are
    # a second copy of assets/fonts by necessity: Flutter reads the .ttf, and
    # the WebView cannot reach it.
    - assets/gcode/viewer.html
    - assets/gcode/viewer.js
    - assets/gcode/fonts.css
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
        # 800 rather than a fifth weight nobody asks for: `DashText.monoTitle`
        # is w800 in eleven places and, with no face for it, was resolving to
        # the 700 above — so `monoTitle` and `monoHeadline` rendered identically
        # while the design asks for two different weights. The 500 this replaces
        # was the mirror image: shipped, and requested by nothing.
        #
        # Taken from the same JetBrains Mono 2.304 release as its siblings,
        # verified by that release's Bold being byte-for-byte the 700 above.
        # The OFL travels with the family, not the face (`registerDashFontLicenses`
        # in dash_ui), so the licence page already covers this one.
        - asset: assets/fonts/JetBrainsMono-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A2233"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
