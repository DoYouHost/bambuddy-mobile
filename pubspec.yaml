name: bambuddy_mobile
description: "Natywna aplikacja Android dla bambuddy - self-hosted menedżera drukarek Bambu Lab."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^16.0.0
  intl: any
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.3
  flutter_mjpeg: ^2.0.4
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
