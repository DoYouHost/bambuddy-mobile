name: bambuddy_mobile
description: "Natywna aplikacja Android dla bambuddy - self-hosted menedżera drukarek Bambu Lab."
publish_to: 'none'

version: 0.10.7+1007

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.0
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^16.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.3
  flutter_mjpeg: ^2.0.4
  flutter_local_notifications: ^18.0.1
  flutter_foreground_task: ^9.2.2
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.9
  mobile_scanner: ^7.2.0
  flutter_colorpicker: ^1.1.0
  fl_chart: ^1.2.0
  package_info_plus: ^8.0.0
  home_widget: ^0.7.0
  path_provider: ^2.1.5
  webview_flutter: ^4.10.0
  file_picker: ^8.1.6
  watch_connectivity: ^0.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/hms/
    - assets/icons/
    - assets/icon/icon.png
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A2233"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
