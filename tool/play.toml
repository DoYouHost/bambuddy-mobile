# bambuddy's half of `dart run app_guards:play` (`just play-tracks`,
# `just play-internal`).

# The frozen applicationId — the Play listing's identity, see
# android/app/build.gradle.kts.
package = "page.codeberg.morganmlgman.bambuddy_mobile"

# The service-account key, outside the repo; PLAY_SA_KEY overrides it.
key = "~/.config/bambuddy/play-sa.json"

# Which track a bundle goes to, by its versionCode (the table in the justfile):
# the watch band starts a billion up.
[[bands]]
from = 0
track = "internal"

[[bands]]
from = 1_000_000_000
track = "wear:internal"

# What `just play-screenshots` puts on the en-US listing (the other languages
# inherit it), in order: Play takes 8 per device type, so the dashboard's
# details and maintenance stay in the repo only. Retaken by
# tool/store_screenshots.sh.
[screenshots]
language = "en-US"
phone = [
  "docs/store-assets/screenshots/phone/phone-01-dashboard.png",
  "docs/store-assets/screenshots/phone/phone-03-queue.png",
