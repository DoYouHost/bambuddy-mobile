# bambuddy's half of `dart run app_guards:l10n_language` (the LanguageTool check
# behind `just l10n-check`). The engine and the rules every app shares live in
# app_guards; what is here is this app's own copy and vocabulary.

# The branch the default run diffs against.
base = "dev"

# Rules this app's own copy overrules, each checked against the existing
# strings rather than assumed.
ignored_rules = [
  # A UI label is a phrase and takes no full stop.
  "BRAK_KROPKI",
  # The Polish parenthetical dash is an em dash here (105 uses, no en dash),
  # which the rule reads as a clash with the en dash in a numeric range.
  "NIEKONSEKWETNE_PAUZY",
  # The English copy takes no serial comma (8 to 1).
  "SERIAL_COMMA_ON",
  # "…nie powiodło się." is the app's standard failure line.
  "SIE_SENT_END",
  "UPPERCASE_SENTENCE_START",
  "COMMA_PARENTHESIS_WHITESPACE",
  "NIETYPOWA_KOMBINACJA_DUZYCH_I_MALYCH_LITER",
  # German UI conventions: no non-breaking space required before ellipsis,
  # units or in abbreviations.
  "AUSLASSUNGSPUNKTE_LEERZEICHEN",
  "EINHEIT_LEERZEICHEN",
  "ABKUERZUNG_LEERZEICHEN",
  # False positive on "das Log in einer Datei".
  "LOG_IN",
  # Input field hint text ending with a period.
  "FRAGEZEICHEN_STATT_PUNKT",
  # Spanish UI conventions: units spacing and capitalized short labels.
  "SPACE_UNITIES",
  "MAYUSCULAS_INICIO_FRASE",
  # French, each one checked against every hit in app_fr.arb:
  #   NOMBRES_EN_LETTRES*  the copy writes digits ("code à 6 chiffres"), and
  #                        every placeholder resolves to one
  #   POINT, POINTS_2      a UI label takes no full stop (as BRAK_KROPKI)
  #   TIRET                the A–Z sort labels use an en dash in every locale
  #   DETERMINER_SENT_END  a label ending in a placeholder ("Chargée dans {slot}")
  #   HEURES, ESPACE_UNITES  compact durations ("5h 30min"), as bambuddy's own
  #                        French UI writes them
  #   FRENCH_WHITESPACE    fires only on host:port in the address hint
  #   MOTS_INCOMP          "du slicer": the noun is not in the dictionary
  #   PAS_DE_TRAIT_UNION   "auto-hébergé", spelled as in bambuddy's French UI
  #   PREP_VERBECONJUGUE   the all-caps "PERMISSIONS" section header
  #   CONFUSION_SENT_S_EN, ON_ONT  the Bambu Studio label quoted in English
  #                        ("Store sent files on external storage")
  "NOMBRES_EN_LETTRES",
  "NOMBRES_EN_LETTRES_2",
  "NOMBRES_EN_LETTRES_2_IMPROVED",
  "POINT",
  "POINTS_2",
  "TIRET",
  "DETERMINER_SENT_END",
  "HEURES",
  "ESPACE_UNITES",
  "FRENCH_WHITESPACE",
  "MOTS_INCOMP",
  "PAS_DE_TRAIT_UNION",
  "PREP_VERBECONJUGUE",
  "CONFUSION_SENT_S_EN",
  "ON_ONT",
]

# Words a dictionary hit on says nothing about, matched case-insensitively.
known_words = [
  # Product names, materials and protocol names are in neither dictionary.
  "Bambu", "Bambuddy", "MakerWorld", "Spoolman", "SpoolBuddy",
  "PLA", "PETG", "ABS", "ASA", "TPU", "PVA", "PA", "PC", "PET",
  "X1C", "X1E", "P1S", "P1P", "P2S", "H2C", "H2D", "H2S", "X2D",
  "AMS", "HMS", "FTP", "FTPS", "API", "QR", "JWT", "LDAP", "MQTT", "OIDC",
  "REST", "CIDR", "PDF", "BOM", "°C", "Wi-Fi", "G-code", "Orca", "Avery",
  # Units and file extensions as they appear mid-sentence: "6 h", ".gcode.3mf".
  "h", "gcode",
  # Brands and licences the copy names outright, and the US paper size.
  "Dymo", "Affero", "Keystore", "Letter", "Handy",
  # Additional brands, products, technical terms and UI acronyms.
  "Lab", "Studio", "Cloud", "Brother", "Authenticator", "Ludicrous",
  # Google's name for the wallpaper-derived palette, quoted as Android shows it.
  "Material", "You",
  "US", "Aux", "Temp", "Z", "hash", "hex", "proxy", "relay", "robin", "Keys", "code",
  # English terms the Polish copy quotes verbatim, plus loanwords the app uses
  # on purpose.
  "slicer", "slicera", "slicerze", "slicerem", "slicerowi",
  "timelapse", "timelapsa", "pipeline", "pipeline’u",
  "preset", "presetu", "presety", "pendrive", "pendrivem", "ekstruder",
  "ekstrudera", "ekstruderami", "zakolejkowana", "warping", "runout",
  "toolpath", "colour", "colours", "https", "http", "scope", "yml",
  "files", "external", "storage", "Device", "nozzle", "hotend", "firmware",
  "toolhead",
  # Labels of other products the copy quotes, so the reader can find them
  # there: bambuddy's own web UI, Home Assistant, the server's group names.
  "Settings", "Assistant", "Workflow", "Administrators",
  # Plural of the app's own coinage, and two ordinary Polish words the
  # dictionary wants to split: "Podprojekty", "Szac. koszt".
  "timelapses", "podprojekty", "szac",
  # Spanish technical and domain terms.
  "preajuste", "preajustes", "desagrupar", "desagrupadas", "desagrupados", "desasignar",
  "desasignada", "deseleccionar", "extruir", "extruido", "subextrusión",
  "multiplaca", "stringing", "est",
  # French: the Docker setting the copy quotes, and bambuddy's own French word
  # for unassigning a spool.
  "host", "désassigner", "désassignée",
]

# Each file with its LanguageTool language and the plural arm whose wording
# agrees with the numeral a placeholder becomes (5): Polish puts 5 in `many`.
[[files]]
path = "lib/l10n/app_pl.arb"
language = "pl-PL"
arm = "many"

[[files]]
path = "lib/l10n/app_en.arb"
language = "en-US"

[[files]]
path = "lib/l10n/app_de.arb"
language = "de-DE"

[[files]]
path = "lib/l10n/app_fr.arb"
language = "fr-FR"

[[files]]
path = "lib/l10n/app_es.arb"
language = "es-ES"

# What a named placeholder becomes, so the checker sees a sentence; any other
# placeholder becomes the numeral 5.
[placeholder_values]
duration = "20 min"
time = "14:00"
code = "PLA-01"
size = "500 MB"
