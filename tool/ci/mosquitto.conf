# A broker that is enough of a Bambu printer for bambuddy to accept one.
#
# POST /printers/ refuses a printer it cannot reach: printer_manager.test_connection
# opens an MQTT session and the route persists nothing unless it succeeds. That
# check is deliberate (a mistyped access code used to create a card that never
# connected), and it is also the only thing standing between CI and a printer —
# so CI answers it rather than working around it.
#
# What the client demands is narrow enough that a stock broker satisfies it:
# BambuMQTTClient sets check_hostname = False and verify_mode = CERT_NONE, so a
# self-signed certificate is fine, and state.connected flips on rc == 0 without
# waiting for any payload. TLS 1.2 is the floor the client declares.
listener 8883
allow_anonymous true
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
